name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'services/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: services/api
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/eks-canary-rollback/api:${{ steps.meta.outputs.tag }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/eks-canary-rollback/frontend:${{ steps.meta.outputs.tag }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: services/worker
          push: true
          tags: ${{ vars.ECR_REGISTRY }}/eks-canary-rollback/worker:${{ steps.meta.outputs.tag }}

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/eks-canary-rollback-gitops
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump image tags and APP_VERSION
        run: |
          sed -i "s|eks-canary-rollback/api:[^ ]*|eks-canary-rollback/api:${IMAGE_TAG}|g" apps/api/deployment.yaml
          sed -i "s|eks-canary-rollback/frontend:[^ ]*|eks-canary-rollback/frontend:${IMAGE_TAG}|g" apps/frontend/deployment.yaml
          sed -i "s|eks-canary-rollback/worker:[^ ]*|eks-canary-rollback/worker:${IMAGE_TAG}|g" apps/worker/deployment.yaml
          sed -i "/name: APP_VERSION/{n;s|value: .*|value: \"${IMAGE_TAG}\"|}" apps/api/deployment.yaml
          sed -i "/name: APP_VERSION/{n;s|value: .*|value: \"${IMAGE_TAG}\"|}" apps/worker/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name  "gitops-bot[bot]"
          git config user.email "gitops-bot[bot]@users.noreply.github.com"
          git add apps/api/deployment.yaml apps/frontend/deployment.yaml apps/worker/deployment.yaml
          git diff --staged --quiet || git commit -m "chore: bump images to ${IMAGE_TAG}"
          git push
